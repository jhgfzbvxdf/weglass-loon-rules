# ============================================================
# 微信输入法（WeType）隐私规则 · Loon
# 生成日期：2026-10-29
# 目标：阻断上报/统计/崩溃收集，保留词典与更新等正常功能
# ============================================================

# ---------- 一、纯上报类：直接拒绝 ----------

# 腾讯远程监控（业务埋点上报）
DOMAIN-SUFFIX,rmonitor.qq.com,REJECT

# 腾讯质量上报 RQD（客户端质量数据）
DOMAIN,ios.rqd.qq.com,REJECT

# Bugly 崩溃、ANR、OOM 上报
DOMAIN-SUFFIX,bugly.qq.com,REJECT
DOMAIN-SUFFIX,bugly.ws,REJECT

# Sentry 崩溃上报
DOMAIN-SUFFIX,sentry.io,REJECT

# Flurry 行为分析
DOMAIN-SUFFIX,flurry.com,REJECT

# 通用埋点/追踪（如出现则拦截）
DOMAIN-SUFFIX,pingfore.qq.com,REJECT
DOMAIN-SUFFIX,beacon.qq.com,REJECT

# ---------- 二、保留：不要封 ----------
# 封了会导致词典、AI、更新失效
#
#   wetype.wxqcloud.qq.com          主 API / 词典资源（腾讯云 COS）
#   wetype.weixin.qq.com            业务接口
#   wetype995.weixin.qq.com         业务接口
#   download.z.weixin.qq.com        客户端更新
#   download.weread.qq.com          字体资源
#   z.weixin.qq.com                 官网
#
# 如需彻底断网（只用本地词库），追加：
#   PROCESS-NAME,WeType,REJECT
#   PROCESS-NAME,WeTypeSettings,REJECT
# 注意：会同时断掉词典更新与 AI 功能。

# ---------- 三、说明 ----------
# 1. 主 API 与上报走同一域名时无法只封上报，此时请改用输入法
#    设置里的「本地模式」，从源头关闭云端能力。
# 2. 规则仅按域名匹配，不依赖 App 版本，输入法升级后依然有效。
